# JTE 镜像发布工作流
#
# 触发：推送 master 自动构建（只刷新 :latest）；打 tag（v*）发布正式版；
# 也可在 Actions 页面手动运行
#
# 镜像目标（三层，按配置逐级启用）：
#   1. GHCR ghcr.io/suoten/jt-engine     —— 零配置，用内置 GITHUB_TOKEN，推送即自动发布
#   2. Docker Hub suoten/jt-engine       —— 需 Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#   3. 阿里云 ACR（国内全家桶用）         —— 需 Secrets：ACR_USERNAME / ACR_PASSWORD，
#      并把 5 个第三方依赖镜像同步到 ACR（国内免费加速器拒绝代理第三方组织镜像）
#
# Secrets 配置（仓库 Settings → Secrets and variables → Actions，按仓库隔离，
# 其他仓库的 Secret 不会自动带过来）：
#   DOCKERHUB_TOKEN：hub.docker.com → Account Settings → Security → New Access Token
#   ACR：cr.console.aliyun.com 个人版（免费）→ 访问凭证（用户名是阿里云全账号）
#
# 改命名空间：同时修改下方 env 和 jte/docker-compose.cn.yml 的默认值
name: docker-publish

on:
  push:
    branches: [master]
    # 兼容大写 V 前缀（GitHub Release 常见手输 V1.1.0；ref 过滤区分大小写）
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，如 1.1.0）'
        required: true
        default: '1.1.0'

env:
  DOCKERHUB_REPO: suoten/jt-engine
  ACR_HOST: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: suoten

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_DH: ${{ secrets.DOCKERHUB_USERNAME != '' && '1' || '0' }}
      HAS_ACR: ${{ secrets.ACR_USERNAME != '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查镜像仓库凭证
        run: |
          if [ "${HAS_DH}" != "1" ] && [ "${HAS_ACR}" != "1" ]; then
            echo "::notice::未配置 Docker Hub / ACR 凭证，本次仅发布到 GHCR（ghcr.io）。国内用户建议配置 Secrets 以启用 Docker Hub/ACR。"
          fi

      - name: 计算版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "flavor=release" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME#v}"; ver="${ver#V}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
            echo "flavor=release" >> "$GITHUB_OUTPUT"
          else
            # master 日常推送：短 SHA 标记，只刷新 :latest，不覆盖 stable/版本标签
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "flavor=edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（内置令牌，零配置）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: env.HAS_DH == '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录阿里云 ACR
        if: env.HAS_ACR == '1'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # arm64 + CGO（go-sqlite3）在 QEMU 下编译较慢（约 20-40 分钟），属正常
      - name: 构建并推送 JTE 镜像（多架构）
        run: |
          VER="${{ steps.ver.outputs.version }}"
          FLAVOR="${{ steps.ver.outputs.flavor }}"
          GHCR_REPO="ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/jt-engine"
          TAGS="-t ${GHCR_REPO}:latest -t ${GHCR_REPO}:sha-${VER}"
          if [ "${FLAVOR}" = "release" ]; then
            TAGS="$TAGS -t ${GHCR_REPO}:stable -t ${GHCR_REPO}:v${VER}"
            if [ "${HAS_DH}" = "1" ]; then
              TAGS="$TAGS -t ${DOCKERHUB_REPO}:latest -t ${DOCKERHUB_REPO}:stable -t ${DOCKERHUB_REPO}:v${VER}"
            fi
            if [ "${HAS_ACR}" = "1" ]; then
              TAGS="$TAGS -t ${ACR_HOST}/${ACR_NAMESPACE}/jte:latest -t ${ACR_HOST}/${ACR_NAMESPACE}/jte:stable -t ${ACR_HOST}/${ACR_NAMESPACE}/jte:v${VER}"
            fi
          else
            if [ "${HAS_DH}" = "1" ]; then
              TAGS="$TAGS -t ${DOCKERHUB_REPO}:latest -t ${DOCKERHUB_REPO}:sha-${VER}"
            fi
            if [ "${HAS_ACR}" = "1" ]; then
              TAGS="$TAGS -t ${ACR_HOST}/${ACR_NAMESPACE}/jte:latest -t ${ACR_HOST}/${ACR_NAMESPACE}/jte:sha-${VER}"
            fi
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${VER}" \
            ${TAGS} \
            --push ./jte

      # 同步第三方依赖镜像到 ACR：国内免费加速器拒绝代理第三方组织镜像，
      # 全家桶在国内的唯一可行路径。imagetools create 直接跨仓库复制 manifest，
      # 不需要 pull/push 完整镜像层
      - name: 同步第三方依赖镜像到 ACR
        if: env.HAS_ACR == '1'
        run: |
          for img in \
            "mysql:8.0" \
            "redis:7-alpine" \
            "tdengine/tdengine:3.3.2.0" \
            "minio/minio:RELEASE.2024-07-16T15-48-33Z" \
            "zlmediakit/zlmediakit:release-12.0.0"
          do
            tag="${img##*:}"
            flat="$(echo "${img%:*}" | tr '/' '-')"
            echo "==> docker.io/${img} -> ${ACR_HOST}/${ACR_NAMESPACE}/${flat}:${tag}"
            docker buildx imagetools create -t "${ACR_HOST}/${ACR_NAMESPACE}/${flat}:${tag}" "docker.io/${img}"
          done
          echo "全部依赖镜像同步完成，国内可用 docker-compose.cn.yml 一键全家桶"
