# JTE 蓝绿部署 Kubernetes 清单
# AUTO-FIX-2026-06-30 [P1-1]: 零停机部署
#
# 架构：
#   - Service (jte-svc) 指向 active 的 Deployment（Blue 或 Green）
#   - 两个 Deployment：jte-blue（当前生产）+ jte-green（新版本，不接流量）
#   - 切换流程：Green 健康检查通过 → Service selector 切到 green → Blue 排空 → Blue 下线
#
# 使用：
#   1. 部署：kubectl apply -f jte-blue-green.yaml
#   2. 切换：./blue-green-switch.sh (Green 健康检查通过后切流量)
#   3. 回滚：./blue-green-switch.sh --rollback (切回 Blue)

---
apiVersion: v1
kind: Namespace
metadata:
  name: jte

---
# ConfigMap 共享配置（Blue/Green 共用）
apiVersion: v1
kind: ConfigMap
metadata:
  name: jte-config
  namespace: jte
data:
  jte.yaml: |
    server:
      host: "0.0.0.0"
      port: 7611
    gateway:
      tcp_port: 7611
      max_connections: 120000
    api:
      enabled: true
      port: 8080
    shutdown:
      drain_timeout_seconds: 300
      api_shutdown_timeout_seconds: 10
      reconnect_backoff_max_seconds: 60
      drain_check_interval_seconds: 5

---
# Secret 敏感配置（生产环境用 SealedSecrets/External Secrets 替代）
# FIXED: [P1-2] 原实现 ${MYSQL_PASSWORD} 在 stringData 中是字面量，K8s 不会展开
# 改为独立 Secret 条目，Pod 环境变量中通过 $(VAR) 语法引用（K8s 自动展开）
apiVersion: v1
kind: Secret
metadata:
  name: jte-secrets
  namespace: jte
type: Opaque
stringData:
  MYSQL_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  TDENGINE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

---
# [工业级加固] PriorityClass 确保 JTE Pod 在资源紧张时优先调度
# preempting: Never — 不抢占低优先级 Pod，但在调度时优先获得资源
# 生产环境建议使用 high 优先级，低于 system-critical（1000000000）
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: jte-high-priority
  labels:
    app: jte
value: 1000000
preemptionPolicy: Never
globalDefault: false
description: "JTE engine pods get this priority to ensure scheduling preference during resource pressure."

---
# Blue Deployment（当前生产版本）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jte-blue
  namespace: jte
  labels:
    app: jte
    slot: blue
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: jte
      slot: blue
  template:
    metadata:
      labels:
        app: jte
        slot: blue
    spec:
      terminationGracePeriodSeconds: 330  # drain_timeout(300) + 30s buffer
      # [工业级加固] 优先级确保资源紧张时 JTE Pod 优先调度
      priorityClassName: jte-high-priority
      # [工业级加固] 跨可用区分布，避免单可用区故障导致全部 Pod 不可用
      topologySpreadConstraints:
        - maxSkew: 1  # 允许的最大不均匀度（1 表示各可用区 Pod 数差异 ≤1）
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule  # 无法满足时拒绝调度（强约束）
          labelSelector:
            matchLabels:
              app: jte
      containers:
      - name: jte
        image: jte-engine:v3.0.0  # FIXED: [P2-1] 固定版本标签，生产环境禁止使用 latest
        ports:
        - containerPort: 7611
          name: gateway
        - containerPort: 8080
          name: api
        env:
        - name: JTE_ACTIVE_SLOT
          value: "blue"
        # FIXED: [P1-2] 使用独立环境变量引用 Secret 条目，K8s 自动展开 $(VAR)
        - name: JTE_STORAGE_DSN
          value: "jte:$(MYSQL_PASSWORD)@tcp(mysql:3306)/jte?parseTime=true"
        - name: JTE_TDENGINE_DSN
          value: "root:$(TDENGINE_PASSWORD)@ws(tdengine1:6041,tdengine2:6041,tdengine3:6041)/jte_ts"
        - name: JTE_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jte-secrets
              key: REDIS_PASSWORD
        envFrom:
        - secretRef:
            name: jte-secrets
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: data
          mountPath: /app/data
        - name: spool
          mountPath: /app/spool
        # 就绪探针：维护模式期间返回 503，自动摘流
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        # 存活探针：进程卡死时重启
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        # 启动探针：慢启动场景（加载模块/连 DB）给足时间
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60  # 最多等 5 分钟启动
        # [工业级加固] 基于压测数据的资源配额
        # 压测基线：10000 设备 × 5s 上报频率，单 Pod 消耗 ~2CPU/2.5GB
        # requests 设为压测 P50，limits 设为 P99，确保突发流量不被 OOM Kill
        resources:
          requests:
            cpu: "2000m"      # 压测 P50: 1.8 CPU
            memory: "3Gi"     # 压测 P50: 2.5 GB
            ephemeral-storage: "5Gi"  # 日志/缓冲临时存储
          limits:
            cpu: "8000m"      # 压测 P99: 6.5 CPU（高并发突发）
            memory: "8Gi"     # 压测 P99: 6.8 GB（批量写入缓冲峰值）
            ephemeral-storage: "20Gi"
        # 优雅停机：SIGTERM → 拒绝新连接 → 下发退避 → 排空 5 分钟 → 退出
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
      - name: config
        configMap:
          name: jte-config
      - name: data
        persistentVolumeClaim:
          claimName: jte-data-blue
      - name: spool
        emptyDir: {}

---
# Green Deployment（新版本，初始不接流量）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jte-green
  namespace: jte
  labels:
    app: jte
    slot: green
spec:
  replicas: 0  # 初始 0 副本，切换时扩容
  selector:
    matchLabels:
      app: jte
      slot: green
  template:
    metadata:
      labels:
        app: jte
        slot: green
    spec:
      terminationGracePeriodSeconds: 330
      # [工业级加固] 与 Blue 相同的优先级和拓扑分布约束
      priorityClassName: jte-high-priority
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: jte
      containers:
      - name: jte
        image: jte-engine:v3.0.0  # FIXED: [P2-1] 固定版本标签，切换前更新为新版本
        ports:
        - containerPort: 7611
          name: gateway
        - containerPort: 8080
          name: api
        env:
        - name: JTE_ACTIVE_SLOT
          value: "green"
        # FIXED: [P1-2] 使用独立环境变量引用 Secret 条目，K8s 自动展开 $(VAR)
        - name: JTE_STORAGE_DSN
          value: "jte:$(MYSQL_PASSWORD)@tcp(mysql:3306)/jte?parseTime=true"
        - name: JTE_TDENGINE_DSN
          value: "root:$(TDENGINE_PASSWORD)@ws(tdengine1:6041,tdengine2:6041,tdengine3:6041)/jte_ts"
        - name: JTE_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jte-secrets
              key: REDIS_PASSWORD
        envFrom:
        - secretRef:
            name: jte-secrets
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: data
          mountPath: /app/data
        - name: spool
          mountPath: /app/spool
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        # [工业级加固] 与 Blue 相同的资源配额
        resources:
          requests:
            cpu: "2000m"
            memory: "3Gi"
            ephemeral-storage: "5Gi"
          limits:
            cpu: "8000m"
            memory: "8Gi"
            ephemeral-storage: "20Gi"
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
      - name: config
        configMap:
          name: jte-config
      - name: data
        persistentVolumeClaim:
          claimName: jte-data-green
      - name: spool
        emptyDir: {}

---
# Service 通过 selector 切换 Blue/Green
apiVersion: v1
kind: Service
metadata:
  name: jte-svc
  namespace: jte
  labels:
    app: jte
spec:
  type: ClusterIP
  selector:
    app: jte
    slot: blue  # 初始指向 Blue，切换时改为 green
  ports:
  - name: gateway
    port: 7611
    targetPort: 7611
  - name: api
    port: 8080
    targetPort: 8080

---
# PVC for Blue
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jte-data-blue
  namespace: jte
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi

---
# PVC for Green
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jte-data-green
  namespace: jte
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi

---
# PodDisruptionBudget 已移至独立的 pdb.yaml 文件，避免重复定义
# 请使用：kubectl apply -f pdb.yaml
