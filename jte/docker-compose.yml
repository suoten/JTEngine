version: "3.8"

services:
  jte:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7611:7611"
      - "8080:8080"
    volumes:
      - ./configs:/app/configs
      - ./modules:/app/modules
    depends_on:
      - zlmediakit
    environment:
      - JTE_GATEWAY_TCPPORT=7611
      - JTE_API_PORT=8080
      - JTE_STORAGE_TYPE=memory
      - JTE_ZLMEDIAKIT_URL=http://zlmediakit:80

  zlmediakit:
    image: zlmediakit/zlmediakit:master
    ports:
      - "80:80"
      - "1935:1935"
      - "554:554"
      - "8000:8000/udp"
    volumes:
      - zlm-data:/opt/media

volumes:
  zlm-data: