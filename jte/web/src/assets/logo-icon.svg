<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <polygon points="100,15 173.2,57.5 173.2,142.5 100,185 26.8,142.5 26.8,57.5" 
             fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>
    <polygon points="100,25 164.54,62.5 164.54,137.5 100,175 35.46,137.5 35.46,62.5" 
             fill="url(#grad1)" opacity="0.1"/>
  </g>
  
  <g filter="url(#glow)">
    <path d="M70 55 L70 115 Q70 145 100 145 Q130 145 130 115 L130 95" 
          fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <path d="M130 95 L150 95" 
          fill="none" stroke="url(#grad2)" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <circle cx="100" cy="55" r="8" fill="url(#grad2)" filter="url(#glow)"/>
  
  <circle cx="50" cy="70" r="3" fill="#60a5fa" opacity="0.8"/>
  <circle cx="150" cy="70" r="3" fill="#a78bfa" opacity="0.8"/>
  <circle cx="40" cy="110" r="2.5" fill="#60a5fa" opacity="0.6"/>
  <circle cx="160" cy="110" r="2.5" fill="#a78bfa" opacity="0.6"/>
  <circle cx="55" cy="150" r="2" fill="#60a5fa" opacity="0.5"/>
  <circle cx="145" cy="150" r="2" fill="#a78bfa" opacity="0.5"/>
  
  <line x1="50" y1="70" x2="70" y2="80" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <line x1="150" y1="70" x2="130" y2="80" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="110" x2="65" y2="115" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="110" x2="135" y2="115" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  
  <circle cx="100" cy="145" r="10" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.8"/>
  <circle cx="100" cy="145" r="4" fill="url(#grad2)"/>
</svg>
