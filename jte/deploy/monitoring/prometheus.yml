# JTE Prometheus 采集配置

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: jte-production

rule_files:
  - rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # JTE 引擎主服务
  - job_name: jt-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["jt-engine:8080"]
        labels:
          service: jte
          env: production

  # JTE 健康检查
  - job_name: jte-health
    metrics_path: /health/ready
    scrape_interval: 30s
    static_configs:
      - targets: ["jt-engine:8080"]
        labels:
          service: jte-health

  # 节点导出器
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
