# JTE Prometheus 告警规则
# [P2-可观测性] 完善告警规则，覆盖连接/解析/存储/视频/内存/重启/设备离线/主机资源 8 类场景
#
# 使用方法：
#   在 prometheus.yml 中通过 rule_files 加载本文件：
#   rule_files:
#     - /etc/prometheus/alerts.yaml
#
# 指标来源：jte/internal/metrics/metrics.go
#   - jte_active_connections           (gauge)   当前活跃连接数
#   - jte_message_parse_errors_total   (counter) 消息解析错误总数
#   - jte_storage_write_failures_total (counter) 存储写入失败数
#   - jte_video_packet_loss_percent    (gauge)   视频丢包率（百分比）
#   - jte_online_devices               (gauge)   在线设备数
#   - jte_module_restart_count         (gauge)   模块重启次数（最近1小时）
#   - jte_module_status                (gauge)   模块状态（1=running, 0=stopped, -1=failed）
#
# 主机指标来源：node_exporter
#   - node_cpu_seconds_total           (counter) CPU 使用时间
#   - node_memory_MemAvailable_bytes    (gauge)   可用内存
#   - node_memory_MemTotal_bytes        (gauge)   总内存
#
# 进程指标来源：Go runtime
#   - process_resident_memory_bytes     (gauge)   进程内存
#   - process_start_time_seconds        (gauge)   进程启动时间

groups:
  # ==================== 录制规则 ====================
  - name: jte_recording_rules
    interval: 30s
    rules:
      # 内存使用量（MB）
      - record: jte:memory_mb
        expr: process_resident_memory_bytes / (1024 * 1024)

      # 消息解析错误 5 分钟增长率
      - record: jte:message_parse_errors_rate_5m
        expr: rate(jte_message_parse_errors_total[5m])

      # 存储写入失败 5 分钟增长率
      - record: jte:storage_write_failures_rate_5m
        expr: increase(jte_storage_write_failures_total[5m])

      # 在线设备离线比例（相对于配置的最大设备数）
      - record: jte:offline_device_ratio
        expr: (jte_gateway_max_devices - jte_online_devices) / jte_gateway_max_devices

      # 连接使用率
      - record: jte:connection_usage_ratio
        expr: jte_active_connections / jte_gateway_max_devices

      # 主机 CPU 使用率（非 idle 时间占比）
      - record: jte:host_cpu_usage
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)

      # 主机内存使用率
      - record: jte:host_memory_usage
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

  # ==================== 告警规则 ====================
  - name: jte_alerts
    interval: 30s
    rules:
      # ─────────────────────────────────────────────────────────────
      # 告警 1：连接数告警
      # 活跃连接数超过最大连接数的 80%
      # ─────────────────────────────────────────────────────────────
      - alert: JTEHighConnectionUsage
        expr: jte:connection_usage_ratio > 0.8
        for: 5m
        labels:
          severity: warning
          category: gateway
        annotations:
          summary: "JTE 连接数接近上限"
          description: "活跃连接数 {{ $value | humanizePercentage }} 已达容量上限的 80% 以上，持续 5 分钟。"

      # ─────────────────────────────────────────────────────────────
      # 告警 2：消息解析错误告警
      # 5 分钟内解析错误增长率 > 10/s
      # ─────────────────────────────────────────────────────────────
      - alert: JTEMessageParseErrorsHigh
        expr: jte:message_parse_errors_rate_5m > 10
        for: 5m
        labels:
          severity: warning
          category: protocol
        annotations:
          summary: "JTE 消息解析错误率过高"
          description: "5 分钟内消息解析错误增长率 {{ $value }}/s 超过 10/s 阈值。"

      # ─────────────────────────────────────────────────────────────
      # 告警 3：存储写入失败告警
      # 5 分钟内写入失败增长 > 5 次
      # ─────────────────────────────────────────────────────────────
      - alert: JTEStorageWriteFailureRateHigh
        expr: jte:storage_write_failures_rate_5m > 5
        for: 5m
        labels:
          severity: critical
          category: storage
        annotations:
          summary: "JTE 存储写入失败率过高"
          description: "5 分钟内存储写入失败 {{ $value }} 次，超过 5 次阈值。数据库可能不可达或磁盘已满。"

      # ─────────────────────────────────────────────────────────────
      # 告警 4：视频丢包率告警
      # 视频丢包率 > 5%
      # ─────────────────────────────────────────────────────────────
      - alert: JTEVideoPacketLossHigh
        expr: jte_video_packet_loss_percent > 5
        for: 5m
        labels:
          severity: warning
          category: video
        annotations:
          summary: "JTE 视频丢包率过高"
          description: "视频丢包率 {{ $value }}% 超过 5% 阈值，持续 5 分钟。"

      # ─────────────────────────────────────────────────────────────
      # 告警 5：进程内存告警
      # 进程内存使用超过 2048MB
      # ─────────────────────────────────────────────────────────────
      - alert: JTEMemoryHigh
        expr: jte:memory_mb > 2048
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "JTE 进程内存使用过高"
          description: "进程内存使用 {{ $value }}MB，超过 2048MB 阈值，持续 5 分钟。可能存在内存泄漏或缓存堆积。"

      # 进程内存超过 4096MB 升级为 critical
      - alert: JTEMemoryCritical
        expr: jte:memory_mb > 4096
        for: 2m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "JTE 内存使用危险"
          description: "进程内存使用 {{ $value }}MB，超过 4096MB 阈值。OOM 风险极高。"

      # ─────────────────────────────────────────────────────────────
      # 告警 6：进程重启告警
      # 5 分钟内进程重启次数 > 0
      # ─────────────────────────────────────────────────────────────
      - alert: JTEProcessRestarted
        expr: changes(process_start_time_seconds[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "JTE 进程异常重启"
          description: "JTE 引擎 {{ $labels.instance }} 在过去 5 分钟内发生重启。"

      # ─────────────────────────────────────────────────────────────
      # 告警 7：模块崩溃告警
      # 模块状态指标 jte_module_status 为 -1（failed）
      # ─────────────────────────────────────────────────────────────
      - alert: JTEModuleDown
        expr: jte_module_status == -1
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "JTE 模块崩溃"
          description: "模块 {{ $labels.module }} 状态为 failed，持续 5 分钟。supervisor 正在尝试自动重启。"

      # ─────────────────────────────────────────────────────────────
      # 告警 8：在线设备数突降告警
      # 在线设备数 5 分钟内下降超过 20%（突降检测）
      # ─────────────────────────────────────────────────────────────
      - alert: JTEOnlineDevicesDrop
        expr: (jte_online_devices - jte_online_devices offset 5m) / jte_online_devices offset 5m < -0.2
        for: 5m
        labels:
          severity: critical
          category: gateway
        annotations:
          summary: "JTE 在线设备数突降"
          description: "在线设备数在 5 分钟内下降超过 20%，当前 {{ $value | humanizePercentage }}。可能存在网络故障或大面积设备掉线。"

      # 设备离线比例超过 10%
      - alert: JTEDeviceOfflineRate
        expr: jte:offline_device_ratio > 0.1
        for: 5m
        labels:
          severity: warning
          category: gateway
        annotations:
          summary: "JTE 设备离线率过高"
          description: "离线设备比例 {{ $value | humanizePercentage }} 超过 10%。"

      # ─────────────────────────────────────────────────────────────
      # 告警 9：主机 CPU > 80%
      # 主机 CPU 使用率超过 80%
      # ─────────────────────────────────────────────────────────────
      - alert: JTEHostCPUHigh
        expr: jte:host_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
          category: host
        annotations:
          summary: "JTE 主机 CPU 使用率过高"
          description: "主机 {{ $labels.instance }} CPU 使用率 {{ $value | humanizePercentage }} 超过 80%，持续 5 分钟。"

      # ─────────────────────────────────────────────────────────────
      # 告警 10：主机内存 > 90%
      # 主机内存使用率超过 90%
      # ─────────────────────────────────────────────────────────────
      - alert: JTEHostMemoryHigh
        expr: jte:host_memory_usage > 0.9
        for: 5m
        labels:
          severity: critical
          category: host
        annotations:
          summary: "JTE 主机内存使用率过高"
          description: "主机 {{ $labels.instance }} 内存使用率 {{ $value | humanizePercentage }} 超过 90%，持续 5 分钟。OOM 风险极高。"
