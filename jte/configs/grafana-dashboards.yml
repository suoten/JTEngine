# ============================================================================
# JTE Grafana 仪表盘自动配置
# ============================================================================

apiVersion: 1

providers:
  - name: 'JTE Dashboards'
    orgId: 1
    folder: 'JTE'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
