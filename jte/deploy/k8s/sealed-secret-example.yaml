# Kubernetes 密钥管理方案
# Sealed Secrets + External Secrets (Vault) 示例
#
# 本文件提供两种生产级密钥管理方案，按需选择其一：
#   方案 A: Sealed Secrets（适合 GitOps，密钥加密后可安全提交到 Git）
#   方案 B: External Secrets + HashiCorp Vault（适合集中式密钥管理）

# ═══════════════════════════════════════════════════════════════
# 方案 A: Sealed Secrets
# ═══════════════════════════════════════════════════════════════
#
# 前置条件：集群已安装 sealed-secrets-controller
#   kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.3/controller.yaml
#
# 使用流程：
#   1. 安装 kubeseal CLI: https://github.com/bitnami-labs/sealed-secrets#installation
#   2. 加密 Secret：
#      echo -n '<your-value>' | kubeseal --raw --namespace jte --name jte-secrets --scope namespace
#   3. 将加密后的值填入下方 SealedSecret 清单
#   4. kubectl apply -f sealed-secret-example.yaml

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jte-secrets
  namespace: jte
spec:
  encryptedData:
    # 使用 kubeseal 加密后的密文（以下为示例，请替换为实际 kubeseal --raw 输出）
    # 运行: echo -n 'your-value' | kubeseal --raw --namespace jte --name jte-secrets --scope namespace
    # mysql_dsn: "<kubeseal-encrypted-value>"
    # redis_addr: "<kubeseal-encrypted-value>"
    # tdengine_dsn: "<kubeseal-encrypted-value>"
    # minio_ak: "<kubeseal-encrypted-value>"
    # minio_sk: "<kubeseal-encrypted-value>"
  template:
    metadata:
      name: jte-secrets
      namespace: jte
    type: Opaque

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: website-secrets
  namespace: jte-website
spec:
  encryptedData:
    # 使用 kubeseal 加密后的密文（以下为示例，请替换为实际 kubeseal --raw 输出）
    # 运行: echo -n 'your-value' | kubeseal --raw --namespace jte-website --name website-secrets --scope namespace
    # jwt: "<kubeseal-encrypted-value>"
    # db: "<kubeseal-encrypted-value>"
    # wechat: "<kubeseal-encrypted-value>"
    # alipay: "<kubeseal-encrypted-value>"
    # smtp: "<kubeseal-encrypted-value>"
  template:
    metadata:
      name: website-secrets
      namespace: jte-website
    type: Opaque

# ═══════════════════════════════════════════════════════════════
# 方案 B: External Secrets + HashiCorp Vault
# ═══════════════════════════════════════════════════════════════
#
# 前置条件：
#   1. 部署 HashiCorp Vault（https://developer.hashicorp.com/vault/install）
#   2. 安装 external-secrets-operator
#      kubectl apply -f https://raw.githubusercontent.com/external-secrets/external-secrets/main/deploy/crds/bundle.yaml
#   3. 在 Vault 中存储密钥：
#      vault kv put secret/jte mysql_dsn=<value> redis_addr=<value> tdengine_dsn=<value>
#      vault kv put secret/jte-website jwt=<value> db=<value>
#   4. 配置 Vault 认证（Kubernetes auth method）
#
# 使用：kubectl apply -f sealed-secret-example.yaml

---
# SecretStore：连接 Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: jte
spec:
  provider:
    vault:
      server: "https://vault.jte.example.com"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "jte-role"
          serviceAccountRef:
            name: jte-sa
            namespace: jte

---
# ExternalSecret：从 Vault 拉取密钥到 K8s Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jte-secrets-from-vault
  namespace: jte
spec:
  refreshInterval: 1h  # 每小时自动刷新密钥
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: jte-secrets  # 生成的 K8s Secret 名称
    creationPolicy: Owner
  data:
    - secretKey: mysql_dsn
      remoteRef:
        key: secret/jte
        property: mysql_dsn
    - secretKey: redis_addr
      remoteRef:
        key: secret/jte
        property: redis_addr
    - secretKey: tdengine_dsn
      remoteRef:
        key: secret/jte
        property: tdengine_dsn
