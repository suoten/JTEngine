# ============================================================================
# JTE Engine Promtail 日志采集配置
#
# 验收标准 v3.0 §14.9：日志聚合 — 全模块覆盖
#
# 采集 JTE 引擎和各模块的结构化 JSON 日志，发送到 Loki
# ============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: jte

scrape_configs:
  # JTE 主引擎日志
  - job_name: jte-engine
    static_configs:
      - targets:
          - localhost
        labels:
          job: jte
          service: jte-engine
          __path__: /var/log/jte/*.log
    pipeline_stages:
      # 解析 JSON 结构化日志
      - json:
          expressions:
            level: level
            module: module
            msg: msg
            trace_id: trace_id
            device_id: device_id
            timestamp: timestamp
      # 设置日志时间戳
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      # 添加 level 标签
      - labels:
          level:
          module:
      # 脱敏：移除日志中的手机号/身份证等敏感信息
      - replace:
          expression: '(1[3-9]\d{9})'
          replace: '***PHONE***'
      - replace:
          expression: '(\d{17}[\dXx])'
          replace: '***IDCARD***'

  # JTE 模块进程日志（gRPC 进程模式）
  - job_name: jte-modules
    static_configs:
      - targets:
          - localhost
        labels:
          job: jte
          service: jte-module
          __path__: /var/log/jte/modules/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            module: module
            msg: msg
      - labels:
          level:
          module:

  # Docker 容器日志（docker-compose 部署模式）
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=jte"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    pipeline_stages:
      - json:
          expressions:
            level: level
            module: module
            trace_id: trace_id
      - labels:
          level:
          module:

  # 系统日志
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: jte
          service: system
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\S+)\s+(?P<host>\S+)\s+(?P<process>\S+):\s+(?P<message>.*)$'
      - timestamp:
          source: timestamp
          format: 'Jan 02 15:04:05'

limits_config:
  readline_rate_enabled: true
  readline_rate: 10000
  readline_burst: 10000
